<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080d1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Chrono Circuit: an action adventure with adult-selected math practice for iPad and desktop.">
  <title>Chrono Circuit · v0.10.0-rc.1</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23080d1d'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%237de3da' stroke-width='3'/%3E%3Cpath d='M16 8v8l6 3' fill='none' stroke='%23ffce78' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css?v=0.9.1">
  <link rel="stylesheet" href="./gate-ui.css?v=0.9.1">
  <link rel="stylesheet" href="./arcade-math.css?v=0.10.0-rc.1">
</head>
<body>
  <div id="app">
    <div id="viewport">
      <canvas id="game" width="320" height="180" aria-label="Chrono Circuit game world"></canvas>
      <div id="hud" aria-live="polite"></div>
      <button id="pause" class="icon-button" aria-label="Pause game">Ⅱ</button>
      <div id="toast" aria-live="assertive"></div>
      <nav id="touch-controls" aria-label="Touch game controls">
        <div class="move-pad">
          <button class="control move" data-action="left" aria-label="Move left">◀</button>
          <button class="control move" data-action="right" aria-label="Move right">▶</button>
          <button class="control climb" data-action="up" aria-label="Climb up">▲</button>
          <button class="control climb" data-action="down" aria-label="Climb down">▼</button>
        </div>
        <button class="control action" data-action="interact" aria-label="Use time machine">TIME</button>
        <button id="power-control" class="control action power-control" data-action="power" aria-label="Use Beat Brake">POWER</button>
        <button id="cycle-control" class="control action" data-action="cycle" aria-label="Switch equipped power">SWAP</button>
        <div class="action-pad">
          <button class="control fire" data-action="fire" aria-label="Fire blaster">FIRE</button>
          <button class="control jump" data-action="jump" aria-label="Jump">JUMP</button>
        </div>
      </nav>
    </div>
    <section id="overlay" aria-live="polite"></section>
    <section id="rotate" role="dialog" aria-modal="true">
      <div class="rotate-card"><div class="rotate-icon">↻</div><h1>Turn your device sideways</h1><p>Tempo needs a little room to run.</p></div>
    </section>
  </div>
  <script type="module" src="./game.js?v=0.9.1"></script>
</body>
</html>
