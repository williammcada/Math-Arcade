name: Deploy verified Cloudflare candidate
on:
  workflow_run:
    workflows: [Verify Math Arcade candidate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      verification_run_id:
        description: Successful main-branch Verify Math Arcade candidate run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    # Only this owner-approved expansion opts into automatic deployment after verification.
    # Routine upstream synchronization and other candidates still require manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_commit.message == 'Math Arcade v0.4 implementation checkpoint [deploy-approved]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require an exact successful verification run
        id: candidate
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ inputs.verification_run_id || github.event.workflow_run.id }}
        with:
          script: |
            if (!/^\d+$/.test(process.env.RUN_ID)) throw Error('Invalid verification run ID');
            const {data:r}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(process.env.RUN_ID)});
            if(r.path!=='.github/workflows/verify.yml'||r.head_branch!=='main'||r.conclusion!=='success'||!['push','workflow_dispatch'].includes(r.event)) throw Error('Select a successful main-branch verification run');
            core.setOutput('source',r.head_sha);
            core.setOutput('run',String(r.id));
      - uses: actions/download-artifact@v4
        with:
          name: worker-candidate-${{ steps.candidate.outputs.source }}
          run-id: ${{ steps.candidate.outputs.run }}
          github-token: ${{ github.token }}
          path: verified
      - name: Extract and verify preserved package
        env:
          SOURCE_SHA: ${{ steps.candidate.outputs.source }}
        run: |
          mkdir release
          tar -xzf verified/math-arcade-*.tar.gz -C release
          cd release
          sha256sum -c build/SHA256SUMS
          node -e "const r=require('./build/release.json');if(r.source!==process.env.SOURCE_SHA)throw Error('Source mismatch')"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: release
      - name: Deploy tested bundle and configure teacher secret
        working-directory: release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARCADE_TEACHER_PASSWORD: ${{ secrets.ARCADE_TEACHER_PASSWORD }}
          SOURCE_SHA: ${{ steps.candidate.outputs.source }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          node -e "for(const k of ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','ARCADE_TEACHER_PASSWORD'])if(!process.env[k])throw Error('Missing repository secret: '+k);if(process.env.ARCADE_TEACHER_PASSWORD.length<12||process.env.ARCADE_TEACHER_PASSWORD.length>200)throw Error('Teacher password must be 12–200 characters')"
          npx wrangler deploy build/worker/worker.js --no-bundle --var "SOURCE_COMMIT:$SOURCE_SHA" | tee deploy-output.txt
          node -e "require('node:fs').writeFileSync(process.env.RUNNER_TEMP+'/arcade-secrets.json',JSON.stringify({ARCADE_TEACHER_PASSWORD:process.env.ARCADE_TEACHER_PASSWORD}),{mode:0o600})"
          trap 'rm -f "$RUNNER_TEMP/arcade-secrets.json"' EXIT
          npx wrangler secret bulk "$RUNNER_TEMP/arcade-secrets.json"
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import {setTimeout as delay} from 'node:timers/promises';
          const url=readFileSync('deploy-output.txt','utf8').match(/https:\/\/math-arcade\.[a-z0-9-]+\.workers\.dev\b/)?.[0];
          if(!url)throw Error('No deployed HTTPS URL found; inspect Wrangler output');
          const expected=JSON.parse(readFileSync('build/release.json'));
          for(let i=0;i<10;i++){
            const r=await fetch(url+'/health');const data=await r.json();
            if(r.ok&&data.version===expected.version&&data.source===expected.source&&data.architecture==='cloudflare-durable-object'){
              console.log('Verified live version and source:',url,data);process.exit(0);
            }
            await delay(3000);
          }
          throw Error('Live source/version did not match the preserved candidate');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-deployment-${{ steps.candidate.outputs.source }}
          path: release/deploy-output.txt
