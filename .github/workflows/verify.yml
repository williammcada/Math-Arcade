name: Verify Math Arcade candidate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build && npm run check && npm test && npm run check:worker
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Browser verification
        run: |
          export CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          mkdir -p test-results
          status=0
          for test in test/*browser.cjs; do
            if ! node "$test" > out.log 2>&1; then status=1; echo "::error title=$test::$(tail -c 1500 out.log | tr '\n' ' ' | sed 's/%/%25/g')"; fi
            tail -3 out.log
          done
          if ! npm run test:worker > w.log 2>&1; then status=1; echo "::error title=test:worker::$(tail -c 1500 w.log | tr '\n' ' ')"; fi
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ github.sha }}
          path: test-results

      - name: Preserve exact tested Worker and assets
        run: node scripts/package-worker.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: worker-candidate-${{ github.sha }}
          path: build/math-arcade-*.tar.gz
          retention-days: 90
