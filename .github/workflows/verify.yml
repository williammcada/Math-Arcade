name: Verify Math Arcade candidate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build && npm run check && npm test && npm run check:worker
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Browser verification
        run: |
          export CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          mkdir -p test-results
          # Each suite's failure is reported as an annotation (readable without downloading logs).
          failed=0
          for test in test/*browser.cjs; do
            if ! node "$test" > "test-results/$(basename "$test").log" 2>&1; then
              failed=1
              echo "::error title=$(basename "$test") failed::$(grep -vE 'ExperimentalWarning|trace-warnings' "test-results/$(basename "$test").log" | tail -12 | tr '\n' ' ' | cut -c1-1500)"
            else
              echo "::notice title=$(basename "$test")::$(grep -m1 '^PASS' "test-results/$(basename "$test").log" | cut -c1-200)"
            fi
          done
          if ! npm run test:worker > test-results/test-worker.log 2>&1; then
            failed=1
            echo "::error title=test:worker failed::$(tail -15 test-results/test-worker.log | tr '\n' ' ' | cut -c1-1500)"
          fi
          exit $failed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ github.sha }}
          path: test-results

      - name: Preserve exact tested Worker and assets
        run: node scripts/package-worker.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: worker-candidate-${{ github.sha }}
          path: build/math-arcade-*.tar.gz
          retention-days: 90
