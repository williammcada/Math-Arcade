name: Sync canonical games and math
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [canonical-source-updated]
permissions:
  contents: write
concurrency:
  group: canonical-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/sync-upstream.mjs
      - run: npm run build && npm run check && npm test
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Verify classroom and native game adapters
        run: |
          export CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          mkdir -p test-results
          for test in test/*browser.cjs; do node "$test"; done
      - name: Promote verified source snapshots
        run: |
          git add vendor
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'Math Arcade source sync'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync verified canonical games and Math Engine'
          git push origin HEAD:main
